name: Windows preview
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the .NET Framework 4.8 plugin
        run: .\build.ps1
      - name: Exercise the modeless WPF window
        run: .\tools\Test-EditorWindow.ps1 -PluginDirectory src\LibraryComponentEditor\bin\Release\net48
      - name: Upload preview files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LibraryComponentEditor
          path: artifacts/LibraryComponentEditor/
          if-no-files-found: error
